<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAA Inflow-Outflow Dashboard — FY 25-26</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #2a3450;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --green: #34d399;
    --red: #f87171;
    --orange: #fb923c;
    --yellow: #fbbf24;
    --pink: #f472b6;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app-header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .app-header h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .app-header .subtitle {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 12px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-wrap: wrap;
  }

  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text2);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab:hover { background: var(--surface2); color: var(--text); }
  .tab.active { background: var(--accent); color: #0a0e17; border-color: var(--accent); font-weight: 600; }

  .content { padding: 24px 32px; max-width: 1600px; margin: 0 auto; }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    background: var(--surface);
    margin-bottom: 24px;
    transition: all 0.3s;
  }

  .upload-zone:hover { border-color: var(--accent); }

  .upload-zone h3 { font-size: 18px; margin-bottom: 8px; }
  .upload-zone p { color: var(--text2); font-size: 14px; margin-bottom: 16px; }

  .upload-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .upload-btn.primary { background: var(--accent); color: #0a0e17; }
  .upload-btn.primary:hover { background: #7dd3fc; }
  .upload-btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .upload-btn.secondary:hover { border-color: var(--accent); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .card .label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .card .sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .card .value.green { color: var(--green); }
  .card .value.red { color: var(--red); }
  .card .value.blue { color: var(--accent); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  th {
    background: var(--surface2);
    padding: 12px 14px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    white-space: nowrap;
  }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  tr:hover td { background: rgba(56, 189, 248, 0.05); }
  tr:last-child td { border-bottom: none; }

  .table-wrap {
    overflow-x: auto;
    border-radius: 12px;
    margin-bottom: 24px;
    max-height: 600px;
    overflow-y: auto;
  }

  .section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .pos { color: var(--green); }
  .neg { color: var(--red); }

  textarea {
    width: 100%;
    min-height: 200px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 16px;
    resize: vertical;
    margin-bottom: 12px;
  }

  textarea:focus { outline: none; border-color: var(--accent); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge.pms { background: rgba(56,189,248,0.15); color: var(--accent); }
  .badge.aif { background: rgba(129,140,248,0.15); color: var(--accent2); }

  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 120px;
    padding: 8px 0;
  }

  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .bar {
    width: 100%;
    max-width: 40px;
    border-radius: 4px 4px 0 0;
    min-height: 2px;
    transition: height 0.3s;
  }

  .bar-label {
    font-size: 9px;
    color: var(--text2);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    max-height: 50px;
    overflow: hidden;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: rgba(52,211,153,0.1);
    border: 1px solid rgba(52,211,153,0.2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--green);
    margin-bottom: 24px;
  }

  .filter-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
  }

  select:focus { outline: none; border-color: var(--accent); }

  .hidden { display: none; }

  input[type="file"] { display: none; }
</style>
</head>
<body>

<div class="app-header">
  <div>
    <h1>AAA Inflow-Outflow Dashboard</h1>
    <div class="subtitle">FY 2025-26 Automation Tool</div>
  </div>
  <div style="font-size:12px;color:var(--text2)" id="dataStatus">No data loaded</div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="input">Data Input</div>
  <div class="tab" data-tab="summary">Summary</div>
  <div class="tab" data-tab="monthly">Monthly Trends</div>
  <div class="tab" data-tab="distributors">Top Distributors</div>
  <div class="tab" data-tab="city">City Analysis</div>
  <div class="tab" data-tab="dist-scheme">Scheme × Distributor</div>
  <div class="tab" data-tab="rm-scheme">Scheme × RM</div>
  <div class="tab" data-tab="dist-perf">Dist Performance</div>
  <div class="tab" data-tab="rm-perf">RM Performance</div>
</div>

<div class="content" id="content"></div>

<script>
// ─── GLOBALS ───
let inflowData = [];
let outflowData = [];
let computed = null;
let baseNormalizedInflow = [];
let baseNormalizedOutflow = [];
let allZones = [];
let allSalesmen = [];
let filters = { zone: 'All', salesman: 'All' };

const SCHEMES = [
  'AAA Budding Beasts Equity',
  'AAA India Opportunity Plan Equity',
  'AAA LIQUID PLAN',
  'AAA India Equity Fund Scheme-1',
  'AAA COUTURE',
  'AAA SHARIAH',
  'AAA Gems Fund'
];

const SCHEME_SHORT = {
  'AAA Budding Beasts Equity': 'Budding Beasts',
  'AAA India Opportunity Plan Equity': 'India Opp Plan',
  'AAA LIQUID PLAN': 'Liquid Plan',
  'AAA India Equity Fund Scheme-1': 'India Equity Fund',
  'AAA COUTURE': 'Couture',
  'AAA SHARIAH': 'Shariah',
  'AAA Gems Fund': 'Gems Fund'
};

const MONTHS = ['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];

const SCHEME_CATEGORY = {
  'AAA Budding Beasts Equity': 'depends',
  'AAA India Opportunity Plan Equity': 'depends',
  'AAA LIQUID PLAN': 'depends',
  'AAA India Equity Fund Scheme-1': 'AIF',
  'AAA COUTURE': 'depends',
  'AAA SHARIAH': 'depends',
  'AAA Gems Fund': 'AIF'
};

function getMonthIdx(dateStr) {
  const d = new Date(dateStr);
  const m = d.getMonth(); // 0-11
  const y = d.getFullYear();
  // FY: Apr(3)=0, May(4)=1, ... Mar(2)=11
  if (m >= 3) return m - 3; // Apr=0 ... Dec=9
  return m + 9; // Jan=10, Feb=11, Mar=12 -> wait Mar=11
}

function fmt(n, dec=2) {
  if (n === 0) return '0.00';
  if (Math.abs(n) < 0.001) return n.toFixed(4);
  return n.toFixed(dec);
}

function fmtCr(n) {
  return '₹' + fmt(n) + ' Cr';
}

function pct(n) {
  return (n * 100).toFixed(1) + '%';
}

function naturalSort(a, b) {
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
}

// ─── PARSE CSV ───
function parseCSV(text) {
  // Strip BOM and weird whitespace
  text = text.replace(/^\uFEFF/, '').replace(/^\u00EF\u00BB\u00BF/, '').trim();
  
  const result = Papa.parse(text, { header: true, skipEmptyLines: true, dynamicTyping: false });
  
  // Clean headers: trim, remove non-breaking spaces, normalize
  return result.data.map(row => {
    const clean = {};
    for (const [k, v] of Object.entries(row)) {
      const cleanKey = k.replace(/[\u00A0\u200B\uFEFF]/g, ' ').trim();
      clean[cleanKey] = typeof v === 'string' ? v.trim() : v;
    }
    return clean;
  });
}

function parseNum(val) {
  if (val === null || val === undefined || val === '') return 0;
  if (typeof val === 'number') return val;
  // Remove commas, currency symbols, spaces
  const cleaned = String(val).replace(/[,₹\s]/g, '').trim();
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function findCol(row, patterns) {
  // Find the first column key that matches any of the patterns
  for (const k of Object.keys(row)) {
    const kl = k.toLowerCase().replace(/[\s_\-]+/g, '');
    for (const p of patterns) {
      if (kl.includes(p)) return k;
    }
  }
  return null;
}

function normalizeRow(row, type) {
  // --- AMOUNT (try multiple strategies) ---
  let amtCrs = 0;
  
  // Strategy 1: "Amt in Crs" column (most reliable, small number)
  const crsCol = findCol(row, ['amtincr', 'crs', 'crore']);
  if (crsCol) {
    amtCrs = parseNum(row[crsCol]);
  }
  
  // Strategy 2: "Inflow amount" / "Outflow amount" column
  if (amtCrs === 0) {
    const amtPatterns = type === 'inflow' ? ['inflowamount', 'infowamt'] : ['outflowamount', 'outfowamt'];
    const amtCol = findCol(row, amtPatterns);
    if (amtCol) {
      amtCrs = parseNum(row[amtCol]) / 10000000;
    }
  }
  
  // Strategy 3: Try any column with "amount" in it
  if (amtCrs === 0) {
    const amtCol = findCol(row, ['amount']);
    if (amtCol) {
      amtCrs = parseNum(row[amtCol]) / 10000000;
    }
  }
  
  // --- SCHEME ---
  let scheme = '';
  const schemeCol = findCol(row, ['scheme']);
  if (schemeCol) scheme = String(row[schemeCol] || '').trim();
  
  // --- CATEGORY (PMS/AIF) ---
  let cat = '';
  const catCol = findCol(row, ['pms/aif', 'pms', 'category', 'type']);
  if (catCol) {
    const val = String(row[catCol] || '').trim().toUpperCase();
    if (val === 'PMS' || val === 'AIF') cat = val;
  }
  // If column name is "PMS/AIF", get the value directly
  if (!cat) {
    for (const k of Object.keys(row)) {
      if (k.trim() === 'PMS/AIF' || k.trim().toLowerCase() === 'pms/aif') {
        cat = String(row[k] || '').trim().toUpperCase();
        break;
      }
    }
  }
  
  // --- DISTRIBUTOR ---
  let dist = '';
  const distCol = findCol(row, ['nameofdistributor', 'distributor']);
  if (distCol) {
    // Make sure it's the distributor name column, not the RM column
    const kl = distCol.toLowerCase();
    if (!kl.includes('rm') || kl.includes('name of dist')) {
      dist = String(row[distCol] || '').trim();
    }
  }
  // Fallback: try exact column names
  if (!dist) {
    for (const k of Object.keys(row)) {
      const kt = k.trim();
      if (kt === 'Name of Distributor' || kt === 'Distributor') {
        dist = String(row[k] || '').trim();
        break;
      }
    }
  }
  
  // --- AAA RM ---
  let rm = '';
  for (const k of Object.keys(row)) {
    const kt = k.trim();
    const kl = kt.toLowerCase().replace(/[\s_\-]+/g, '');
    if (kl === 'aaarm' || kt === 'AAA RM' || kt === 'AAARM') {
      rm = String(row[k] || '').trim();
      break;
    }
  }
  
  // --- DISTRIBUTOR RM NAME (RM 1, RM 2, etc.) ---
  let distRM = '';
  for (const k of Object.keys(row)) {
    const kl = k.toLowerCase();
    if ((kl.includes('distributor') && kl.includes('rm')) || kl === 'distributor- rm name') {
      distRM = String(row[k] || '').trim();
      break;
    }
  }
  
  // --- CITY / LOCATION ---
  let city = '';
  const cityCol = findCol(row, ['location', 'city']);
  if (cityCol) city = String(row[cityCol] || '').trim();

  // --- ZONE ---
  let zone = '';
  for (const k of Object.keys(row)) {
    if (k.trim().toLowerCase() === 'zone') {
      zone = String(row[k] || '').trim();
      break;
    }
  }

  // --- SALESMAN (AAA Sales member) ---
  let salesman = '';
  for (const k of Object.keys(row)) {
    const kt = k.trim().toLowerCase();
    if (kt === 'aaa sales member' || kt === 'salesman' || kt === 'sales member' || kt === 'sales man' || kt.includes('sales member') || kt.includes('salesman')) {
      salesman = String(row[k] || '').trim();
      break;
    }
  }
  
  // --- DATE ---
  let date = '';
  const dateCol = findCol(row, ['date']);
  if (dateCol) date = String(row[dateCol] || '').trim();
  
  // --- CLIENT ---
  let clientCode = '', clientName = '';
  const codeCol = findCol(row, ['clientcode', 'code']);
  const nameCol = findCol(row, ['clientname']);
  if (codeCol) clientCode = String(row[codeCol] || '').trim();
  if (nameCol) clientName = String(row[nameCol] || '').trim();

  return {
    clientCode,
    clientName,
    date,
    category: cat,
    distributor: dist,
    city,
    zone,
    salesman,
    distRM,
    aaaRM: rm,
    scheme,
    type,
    amount: amtCrs * 10000000,
    amtCrs
  };
}

// ─── COMPUTE ALL ───
function computeAll() {
  if (inflowData.length === 0 && outflowData.length === 0) { computed = null; return; }

  baseNormalizedInflow = inflowData.map(r => normalizeRow(r, 'inflow'));
  baseNormalizedOutflow = outflowData.map(r => normalizeRow(r, 'outflow'));

  // Build zone + salesman option lists from all data (before filtering)
  const zoneSet = new Set(), smSet = new Set();
  baseNormalizedInflow.concat(baseNormalizedOutflow).forEach(r => {
    if (r.zone) zoneSet.add(r.zone);
    if (r.salesman) smSet.add(r.salesman);
  });
  allZones = [...zoneSet].sort();
  allSalesmen = [...smSet].sort();

  aggregate();
}

function matchFilters(r) {
  return (filters.zone === 'All' || r.zone === filters.zone) &&
         (filters.salesman === 'All' || r.salesman === filters.salesman);
}

function aggregate() {
  const allInflow = baseNormalizedInflow.filter(matchFilters);
  const allOutflow = baseNormalizedOutflow.filter(matchFilters);
  
  // --- SUMMARY ---
  const productSummary = {};
  SCHEMES.forEach(s => { productSummary[s] = { inflow: 0, outflow: 0 }; });
  
  allInflow.forEach(r => {
    if (productSummary[r.scheme]) productSummary[r.scheme].inflow += r.amtCrs;
  });
  allOutflow.forEach(r => {
    if (productSummary[r.scheme]) productSummary[r.scheme].outflow += r.amtCrs;
  });
  
  const categorySummary = { PMS: { inflow: 0, outflow: 0 }, AIF: { inflow: 0, outflow: 0 } };
  allInflow.forEach(r => { if (categorySummary[r.category]) categorySummary[r.category].inflow += r.amtCrs; });
  allOutflow.forEach(r => { if (categorySummary[r.category]) categorySummary[r.category].outflow += r.amtCrs; });
  
  // --- MONTHLY TRENDS ---
  const monthlyByCategory = { PMS: { inflow: new Array(12).fill(0), outflow: new Array(12).fill(0) }, AIF: { inflow: new Array(12).fill(0), outflow: new Array(12).fill(0) } };
  const monthlyByProduct = {};
  SCHEMES.forEach(s => { monthlyByProduct[s] = { inflow: new Array(12).fill(0), outflow: new Array(12).fill(0) }; });
  
  allInflow.forEach(r => {
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) {
      if (monthlyByCategory[r.category]) monthlyByCategory[r.category].inflow[mi] += r.amtCrs;
      if (monthlyByProduct[r.scheme]) monthlyByProduct[r.scheme].inflow[mi] += r.amtCrs;
    }
  });
  allOutflow.forEach(r => {
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) {
      if (monthlyByCategory[r.category]) monthlyByCategory[r.category].outflow[mi] += r.amtCrs;
      if (monthlyByProduct[r.scheme]) monthlyByProduct[r.scheme].outflow[mi] += r.amtCrs;
    }
  });
  
  // --- TOP DISTRIBUTORS ---
  const distData = {};
  allInflow.forEach(r => {
    if (!r.distributor) return;
    if (!distData[r.distributor]) distData[r.distributor] = { pmsIn: 0, aifIn: 0, totalIn: 0, totalOut: 0, byScheme: {}, txCount: 0 };
    distData[r.distributor].totalIn += r.amtCrs;
    distData[r.distributor].txCount++;
    if (r.category === 'PMS') distData[r.distributor].pmsIn += r.amtCrs;
    if (r.category === 'AIF') distData[r.distributor].aifIn += r.amtCrs;
    if (!distData[r.distributor].byScheme[r.scheme]) distData[r.distributor].byScheme[r.scheme] = 0;
    distData[r.distributor].byScheme[r.scheme] += r.amtCrs;
  });
  allOutflow.forEach(r => {
    if (!r.distributor) return;
    if (!distData[r.distributor]) distData[r.distributor] = { pmsIn: 0, aifIn: 0, totalIn: 0, totalOut: 0, byScheme: {}, txCount: 0 };
    distData[r.distributor].totalOut += r.amtCrs;
    distData[r.distributor].txCount++;
  });
  
  // --- CITY ANALYSIS ---
  const cityData = {};
  allInflow.forEach(r => {
    if (!r.city) return;
    if (!cityData[r.city]) cityData[r.city] = { inflow: 0, outflow: 0, monthlyIn: new Array(12).fill(0), monthlyOut: new Array(12).fill(0) };
    cityData[r.city].inflow += r.amtCrs;
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) cityData[r.city].monthlyIn[mi] += r.amtCrs;
  });
  allOutflow.forEach(r => {
    if (!r.city) return;
    if (!cityData[r.city]) cityData[r.city] = { inflow: 0, outflow: 0, monthlyIn: new Array(12).fill(0), monthlyOut: new Array(12).fill(0) };
    cityData[r.city].outflow += r.amtCrs;
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) cityData[r.city].monthlyOut[mi] += r.amtCrs;
  });
  
  // --- DISTRIBUTOR x SCHEME MONTHLY ---
  const distSchemeMonthly = {};
  allInflow.forEach(r => {
    if (!r.distributor || !r.scheme) return;
    const key = r.distributor;
    if (!distSchemeMonthly[key]) distSchemeMonthly[key] = {};
    if (!distSchemeMonthly[key][r.scheme]) distSchemeMonthly[key][r.scheme] = { inflow: new Array(12).fill(0), outflow: new Array(12).fill(0) };
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) distSchemeMonthly[key][r.scheme].inflow[mi] += r.amtCrs;
  });
  allOutflow.forEach(r => {
    if (!r.distributor || !r.scheme) return;
    const key = r.distributor;
    if (!distSchemeMonthly[key]) distSchemeMonthly[key] = {};
    if (!distSchemeMonthly[key][r.scheme]) distSchemeMonthly[key][r.scheme] = { inflow: new Array(12).fill(0), outflow: new Array(12).fill(0) };
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) distSchemeMonthly[key][r.scheme].outflow[mi] += r.amtCrs;
  });
  
  // --- RM x SCHEME MONTHLY (uses Distributor-RM Name: RM 1, RM 2, etc.) ---
  const rmSchemeMonthly = {};
  allInflow.forEach(r => {
    if (!r.distRM || !r.scheme) return;
    const key = r.distRM;
    if (!rmSchemeMonthly[key]) rmSchemeMonthly[key] = {};
    if (!rmSchemeMonthly[key][r.scheme]) rmSchemeMonthly[key][r.scheme] = { inflow: new Array(12).fill(0), outflow: new Array(12).fill(0) };
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) rmSchemeMonthly[key][r.scheme].inflow[mi] += r.amtCrs;
  });
  allOutflow.forEach(r => {
    if (!r.distRM || !r.scheme) return;
    const key = r.distRM;
    if (!rmSchemeMonthly[key]) rmSchemeMonthly[key] = {};
    if (!rmSchemeMonthly[key][r.scheme]) rmSchemeMonthly[key][r.scheme] = { inflow: new Array(12).fill(0), outflow: new Array(12).fill(0) };
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) rmSchemeMonthly[key][r.scheme].outflow[mi] += r.amtCrs;
  });
  
  // --- DIST PERFORMANCE (monthly) ---
  const distPerf = {};
  allInflow.forEach(r => {
    if (!r.distributor) return;
    if (!distPerf[r.distributor]) distPerf[r.distributor] = { totalIn: 0, totalOut: 0, monthlyIn: new Array(12).fill(0), monthlyOut: new Array(12).fill(0), txCount: 0 };
    distPerf[r.distributor].totalIn += r.amtCrs;
    distPerf[r.distributor].txCount++;
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) distPerf[r.distributor].monthlyIn[mi] += r.amtCrs;
  });
  allOutflow.forEach(r => {
    if (!r.distributor) return;
    if (!distPerf[r.distributor]) distPerf[r.distributor] = { totalIn: 0, totalOut: 0, monthlyIn: new Array(12).fill(0), monthlyOut: new Array(12).fill(0), txCount: 0 };
    distPerf[r.distributor].totalOut += r.amtCrs;
    distPerf[r.distributor].txCount++;
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) distPerf[r.distributor].monthlyOut[mi] += r.amtCrs;
  });
  
  // --- RM PERFORMANCE (uses Distributor-RM Name: RM 1, RM 2, etc.) ---
  const rmPerf = {};
  allInflow.forEach(r => {
    if (!r.distRM) return;
    if (!rmPerf[r.distRM]) rmPerf[r.distRM] = { totalIn: 0, totalOut: 0, monthlyIn: new Array(12).fill(0), monthlyOut: new Array(12).fill(0) };
    rmPerf[r.distRM].totalIn += r.amtCrs;
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) rmPerf[r.distRM].monthlyIn[mi] += r.amtCrs;
  });
  allOutflow.forEach(r => {
    if (!r.distRM) return;
    if (!rmPerf[r.distRM]) rmPerf[r.distRM] = { totalIn: 0, totalOut: 0, monthlyIn: new Array(12).fill(0), monthlyOut: new Array(12).fill(0) };
    rmPerf[r.distRM].totalOut += r.amtCrs;
    const mi = getMonthIdx(r.date);
    if (mi >= 0 && mi < 12) rmPerf[r.distRM].monthlyOut[mi] += r.amtCrs;
  });
  
  computed = {
    productSummary,
    categorySummary,
    monthlyByCategory,
    monthlyByProduct,
    distData,
    cityData,
    distSchemeMonthly,
    rmSchemeMonthly,
    rmPerf,
    distPerf,
    inflowCount: allInflow.length,
    outflowCount: allOutflow.length,
    totalInflow: allInflow.reduce((s,r) => s + r.amtCrs, 0),
    totalOutflow: allOutflow.reduce((s,r) => s + r.amtCrs, 0)
  };
  
  document.getElementById('dataStatus').textContent = `✓ ${allInflow.length} inflows, ${allOutflow.length} outflows loaded`;
  document.getElementById('dataStatus').style.color = 'var(--green)';
}

  return `

function setFilter(key, val) {
  filters[key] = val;
  aggregate();
  render();
}

function clearFilters() {
  filters = { zone: 'All', salesman: 'All' };
  aggregate();
  render();
}

// ─── RENDER TABS ───
let currentTab = 'input';

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  currentTab = tab.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  render();
});

function render() {
  const c = document.getElementById('content');
  
  if (currentTab === 'input') renderInput(c);
  else if (!computed) { c.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text2)"><p style="font-size:18px;margin-bottom:8px">No data loaded</p><p>Go to Data Input tab to paste or upload your Inflow/Outflow data</p></div>'; return; }
  
  if (currentTab === 'summary') renderSummary(c);
  else if (currentTab === 'monthly') renderMonthly(c);
  else if (currentTab === 'distributors') renderDistributors(c);
  else if (currentTab === 'city') renderCity(c);
  else if (currentTab === 'dist-scheme') renderDistScheme(c);
  else if (currentTab === 'rm-scheme') renderRMScheme(c);
  else if (currentTab === 'dist-perf') renderDistPerf(c);
  else if (currentTab === 'rm-perf') renderRMPerf(c);
}

        // Find inflow sheet
        const inflowSheet = wb.SheetNames.find(n => n.toLowerCase().includes('inflow')) || wb.SheetNames[0];

            for (const [k, v] of Object.entries(row)) {
              if (v instanceof Date) {
                clean[k.trim()] = v.toISOString().split('T')[0];
              } else {
                clean[k.trim()] = v;
              }
            }
            return clean;
          });

        if (outflowSheet && outflowSheet !== inflowSheet) {
          outflowData = XLSX.utils.sheet_to_json(wb.Sheets[outflowSheet], { defval: '' });

            const clean = {};

              if (v instanceof Date) {
                clean[k.trim()] = v.toISOString().split('T')[0];
              } else {
                clean[k.trim()] = v;
              }
            }
            return clean;
          });
        }
        
        computeAll();
        render();
      } catch(err) {
        alert('Error reading XLSX: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  });
  
  document.getElementById('inflowFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = ev => {

      };
      reader.readAsText(file);
    }
  });
  
  document.getElementById('outflowFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = ev => {
        outflowData = parseCSV(ev.target.result);
        document.getElementById('outflowText').value = '(' + outflowData.length + ' rows loaded from ' + file.name + ')';
      };
      reader.readAsText(file);
    }
  });
}

function processData() {
  const it = document.getElementById('inflowText').value;
  const ot = document.getElementById('outflowText').value;
  
  if (it && !it.startsWith('(')) inflowData = parseCSV(it);
  if (ot && !ot.startsWith('(')) outflowData = parseCSV(ot);
  
  computeAll();
  render();
}

    <div class="cards">
      <div class="card"><div class="label">Total Inflow</div><div class="value green">${fmtCr(totalIn)}</div><div class="sub">${d.inflowCount} transactions</div></div>

      <div class="card"><div class="label">Net Flow</div><div class="value ${net >= 0 ? 'green' : 'red'}">${fmtCr(net)}</div><div class="sub">${net >= 0 ? 'Net Positive' : 'Net Negative'}</div></div>

function updateDistSchemeTable() {
  const scheme = document.getElementById('schemeDistFilter').value;
  const type = document.getElementById('distTypeFilter').value;
  const dsm = computed.distSchemeMonthly;
  const container = document.getElementById('distSchemeTable');
  
  const viewLabel = type === 'inflow' ? 'Inflow' : type === 'outflow' ? 'Outflow' : 'Net Flow';
  
  // Gather all distributors that have data for this scheme
  const distRows = [];
  for (const [dist, schemes] of Object.entries(dsm)) {
    if (!schemes[scheme]) continue;
    const inf = schemes[scheme].inflow;
    const out = schemes[scheme].outflow;
    let vals, total;
    if (type === 'inflow') { vals = inf; total = inf.reduce((a,b) => a+b, 0); }
    else if (type === 'outflow') { vals = out; total = out.reduce((a,b) => a+b, 0); }
    else { vals = inf.map((v,i) => v - out[i]); total = vals.reduce((a,b) => a+b, 0); }
    if (type !== 'net' && total === 0) continue;
    if (type === 'net' && inf.reduce((a,b)=>a+b,0) === 0 && out.reduce((a,b)=>a+b,0) === 0) continue;
    distRows.push({ name: dist, vals, total, totalIn: inf.reduce((a,b)=>a+b,0), totalOut: out.reduce((a,b)=>a+b,0) });
  }
  distRows.sort((a, b) => Math.abs(b.total) - Math.abs(a.total));
  
  let html = `<div class="section-title"><div class="dot"></div> ${SCHEME_SHORT[scheme]} — All Distributors Monthly ${viewLabel} (₹ Crs)</div>`;
  html += `<div class="table-wrap"><table><thead><tr><th>Distributor</th>`;
  MONTHS.forEach(m => html += `<th>${m}</th>`);
  html += `<th>Total</th></tr></thead><tbody>`;
  
  distRows.forEach(row => {
    html += `<tr><td style="font-family:'DM Sans';font-weight:600">${row.name}</td>`;
    row.vals.forEach(v => {
      let cls = type === 'inflow' ? 'pos' : type === 'outflow' ? 'neg' : (v > 0 ? 'pos' : v < 0 ? 'neg' : '');
      html += `<td class="${cls}">${v !== 0 ? fmt(v) : '<span style="color:#475569">—</span>'}</td>`;
    });
    let cls = type === 'inflow' ? 'pos' : type === 'outflow' ? 'neg' : (row.total >= 0 ? 'pos' : 'neg');
    html += `<td style="font-weight:700" class="${cls}">${fmt(row.total)}</td></tr>`;
  });
  
  // Totals row
  html += `<tr style="font-weight:700;background:var(--surface2)"><td style="font-family:'DM Sans'">TOTAL (${distRows.length} distributors)</td>`;
  for (let i = 0; i < 12; i++) {
    const t = distRows.reduce((s, r) => s + r.vals[i], 0);
    let cls = type === 'inflow' ? 'pos' : type === 'outflow' ? 'neg' : (t >= 0 ? 'pos' : 'neg');
    html += `<td class="${cls}">${fmt(t)}</td>`;
  }
  const gt = distRows.reduce((s, r) => s + r.total, 0);
  let gtCls = type === 'inflow' ? 'pos' : type === 'outflow' ? 'neg' : (gt >= 0 ? 'pos' : 'neg');
  html += `<td class="${gtCls}">${fmt(gt)}</td></tr>`;
  html += `</tbody></table></div>`;
  
  if (distRows.length === 0) {
    html = `<div style="text-align:center;padding:40px;color:var(--text2)">No distributor data found for ${SCHEME_SHORT[scheme]}</div>`;
  }
  
  container.innerHTML = html;
}

}

function updateDistPerfTable() {
  const d = computed;
  const view = document.getElementById('distPerfView').value;
  const sorted = Object.entries(d.distPerf).sort((a, b) => b[1].totalIn - a[1].totalIn);
  const container = document.getElementById('distPerfTableWrap');
  
  const viewLabel = view === 'inflow' ? 'Inflow' : view === 'outflow' ? 'Outflow' : 'Net Flow';
  
  let html = `<div class="section-title"><div class="dot"></div> Distributor Performance — Monthly ${viewLabel} (₹ Crs)</div>`;
  html += `<div class="table-wrap"><table><thead><tr><th>Distributor</th><th>Total Inflow</th><th>Total Outflow</th><th>Net Flow</th><th>Net %</th><th># Tx</th>`;
  MONTHS.forEach(m => html += `<th>${m}</th>`);
  html += `</tr></thead><tbody>`;
  
  sorted.forEach(([dist, data]) => {
    const nf = data.totalIn - data.totalOut;
    const nfPct = data.totalIn > 0 ? (nf / data.totalIn) : 0;
    html += `<tr>
      <td style="font-family:'DM Sans';font-weight:600">${dist}</td>
      <td class="pos" style="font-weight:600">${fmt(data.totalIn)}</td>
      <td class="neg">${fmt(data.totalOut)}</td>
      <td class="${nf >= 0 ? 'pos' : 'neg'}" style="font-weight:600">${fmt(nf)}</td>
      <td>${pct(nfPct)}</td>
      <td>${data.txCount}</td>`;
    for (let i = 0; i < 12; i++) {
      let val;
      if (view === 'inflow') val = data.monthlyIn[i];
      else if (view === 'outflow') val = data.monthlyOut[i];
      else val = data.monthlyIn[i] - data.monthlyOut[i];
      
      let cls = '';
      if (view === 'inflow') cls = val > 0 ? 'pos' : '';
      else if (view === 'outflow') cls = val > 0 ? 'neg' : '';
      else cls = val > 0 ? 'pos' : val < 0 ? 'neg' : '';
      
      html += `<td class="${cls}">${val !== 0 ? fmt(val) : '<span style="color:#475569">—</span>'}</td>`;
    }
    html += `</tr>`;
  });
  
  // Totals row
  html += `<tr style="font-weight:700;background:var(--surface2)"><td style="font-family:'DM Sans'">TOTAL</td>`;
  const totIn = sorted.reduce((s, [_, d]) => s + d.totalIn, 0);
  const totOut = sorted.reduce((s, [_, d]) => s + d.totalOut, 0);
  const totNet = totIn - totOut;
  html += `<td class="pos">${fmt(totIn)}</td><td class="neg">${fmt(totOut)}</td><td class="${totNet >= 0 ? 'pos' : 'neg'}">${fmt(totNet)}</td><td>${pct(totIn > 0 ? totNet/totIn : 0)}</td><td>${sorted.reduce((s,[_,d])=>s+d.txCount,0)}</td>`;
  for (let i = 0; i < 12; i++) {
    let val;
    if (view === 'inflow') val = sorted.reduce((s, [_, d]) => s + d.monthlyIn[i], 0);
    else if (view === 'outflow') val = sorted.reduce((s, [_, d]) => s + d.monthlyOut[i], 0);
    else val = sorted.reduce((s, [_, d]) => s + d.monthlyIn[i] - d.monthlyOut[i], 0);
    let cls = view === 'inflow' ? 'pos' : view === 'outflow' ? 'neg' : (val >= 0 ? 'pos' : 'neg');
    html += `<td class="${cls}">${fmt(val)}</td>`;
  }
  html += `</tr>`;
  
  html += `</tbody></table></div>`;
  container.innerHTML = html;
}
