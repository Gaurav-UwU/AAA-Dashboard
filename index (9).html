// ─── DIST PERFORMANCE ───
function renderDistPerf(c) {
  let html = renderFilterBar() + `<div class="filter-row">
    <label style="font-size:13px;color:var(--text2)">View:</label>
    <select id="distPerfView" onchange="updateDistPerfTable()">
      <option value="inflow">Monthly Inflow</option>
      <option value="outflow">Monthly Outflow</option>
      <option value="net">Monthly Net Flow</option>
    </select>
  </div>`;
  html += `<div id="distPerfTableWrap"></div>`;
  c.innerHTML = html;
  updateDistPerfTable();
}

function buildPerfRows(perfMap, view, y1, y2, sortByNaturalKey = false) {
  const rows = [];
  for (const [name, byFY] of Object.entries(perfMap)) {
    const b1 = byFY[y1] || { totalIn: 0, totalOut: 0, monthlyIn: new Array(12).fill(0), monthlyOut: new Array(12).fill(0), txCount: 0 };
    const b2 = byFY[y2] || { totalIn: 0, totalOut: 0, monthlyIn: new Array(12).fill(0), monthlyOut: new Array(12).fill(0), txCount: 0 };
    let arr1, arr2;
    if (view === 'inflow') { arr1 = b1.monthlyIn; arr2 = b2.monthlyIn; }
    else if (view === 'outflow') { arr1 = b1.monthlyOut; arr2 = b2.monthlyOut; }
    else { arr1 = b1.monthlyIn.map((v, i) => v - b1.monthlyOut[i]); arr2 = b2.monthlyIn.map((v, i) => v - b2.monthlyOut[i]); }
    rows.push({ name, b1, b2, arr1, arr2 });
  }
  rows.sort((a, b) => {
    if (b.b2.totalIn !== a.b2.totalIn) return b.b2.totalIn - a.b2.totalIn;
    return sortByNaturalKey ? naturalSort(a.name, b.name) : 0;
  });
  return rows;
}

function renderPerfTable(container, entityLabel, rows, view, y1, y2, showTxCount) {
  const single = isSingleFY();
  const lbl1 = fyLabel(y1), lbl2 = fyLabel(y2);
  const cls = view === 'inflow' ? 'pos' : view === 'outflow' ? 'neg' : '';
  const viewLabel = view === 'inflow' ? 'Inflow' : view === 'outflow' ? 'Outflow' : 'Net Flow';
  const accent = view === 'inflow' ? 'accent-lime' : view === 'outflow' ? 'accent-crimson' : 'accent-violet';
  const tid = 'tbl_perf_' + entityLabel.replace(/\W+/g, '');

  let html = `<div class="section-title ${accent}"><div class="swatch"></div><h2>${entityLabel} <em>Performance</em></h2><span class="tag">Monthly ${viewLabel}${single ? '' : ' · ' + lbl1 + ' vs ' + lbl2}</span></div>`;
  html += tableTools(tid, entityLabel.toLowerCase() + '_perf.csv', 'Search ' + entityLabel.toLowerCase() + '…');
  html += `<div class="table-wrap"><table id="${tid}"><thead>`;

  if (single) {
    html += `<tr><th>${entityLabel}</th><th>Total Inflow</th><th>Total Outflow</th><th>Net Flow</th><th>Net %</th>${showTxCount ? '<th># Tx</th>' : ''}${monthHeaderCells()}</tr>`;
  } else {
    html += `<tr><th rowspan="2">${entityLabel}</th>
      <th colspan="3" style="text-align:center;border-bottom:1px solid var(--border)">Total Inflow</th>
      <th colspan="3" style="text-align:center;border-bottom:1px solid var(--border)">Total Outflow</th>
      <th colspan="3" style="text-align:center;border-bottom:1px solid var(--border)">Net Flow</th>
      <th colspan="2" style="text-align:center;border-bottom:1px solid var(--border)">Net %</th>
      ${showTxCount ? '<th rowspan="2"># Tx</th>' : ''}
      ${MONTHS.map((_, i) => `<th colspan="3" style="text-align:center;border-bottom:1px solid var(--border);background:var(--surface2)">${MONTHS[i]}</th>`).join('')}
      <th colspan="3" style="text-align:center;border-bottom:1px solid var(--border);background:var(--bg)">Total</th></tr>
      <tr><th>${lbl1}</th><th>${lbl2}</th><th>Δ%</th>
          <th>${lbl1}</th><th>${lbl2}</th><th>Δ%</th>
          <th>${lbl1}</th><th>${lbl2}</th><th>Δ%</th>
          <th>${lbl1}</th><th>${lbl2}</th>
          ${MONTHS.map((_, i) => `<th style="background:var(--surface2);font-size:10px">${String(y1).slice(-2)}</th><th style="background:var(--surface2);font-size:10px">${String(y2).slice(-2)}</th><th style="background:var(--surface2);color:var(--text2);font-size:10px">Δ%</th>`).join('')}
          <th style="background:var(--bg)">${lbl1}</th><th style="background:var(--bg)">${lbl2}</th><th style="background:var(--bg);color:var(--text2);font-size:10px">Δ%</th></tr>`;
  }
  html += `</thead><tbody>`;

  rows.forEach(row => {
    const { name, b1, b2, arr1, arr2 } = row;
    const nf1 = b1.totalIn - b1.totalOut, nf2 = b2.totalIn - b2.totalOut;
    const nfPct1 = b1.totalIn > 0 ? (nf1 / b1.totalIn) : 0;
    const nfPct2 = b2.totalIn > 0 ? (nf2 / b2.totalIn) : 0;
    html += `<tr><td style="font-family:'DM Sans';font-weight:600">${name}</td>`;
    if (single) {
      html += `<td class="pos" style="font-weight:600">${fmt(b2.totalIn)}</td>
               <td class="neg">${fmt(b2.totalOut)}</td>
               <td class="${nf2>=0?'pos':'neg'}" style="font-weight:600">${fmt(nf2)}</td>
               <td>${pct(nfPct2)}</td>
               ${showTxCount ? `<td>${b2.txCount}</td>` : ''}
               ${monthDataCells(arr1, arr2, cls)}`;
    } else {
      html += `<td class="pos">${fmt(b1.totalIn)}</td><td class="pos" style="font-weight:600">${fmt(b2.totalIn)}</td>${deltaCell(b2.totalIn,b1.totalIn)}
               <td class="neg">${fmt(b1.totalOut)}</td><td class="neg">${fmt(b2.totalOut)}</td>${deltaCell(b2.totalOut,b1.totalOut)}
               <td class="${nf1>=0?'pos':'neg'}">${fmt(nf1)}</td><td class="${nf2>=0?'pos':'neg'}" style="font-weight:600">${fmt(nf2)}</td>${deltaCell(nf2,nf1)}
               <td>${pct(nfPct1)}</td><td>${pct(nfPct2)}</td>
               ${showTxCount ? `<td>${b1.txCount + b2.txCount}</td>` : ''}
               ${monthDataCells(arr1, arr2, cls)}`;
    }
    html += `</tr>`;
  });

  // Totals row
  const TI1 = rows.reduce((s, r) => s + r.b1.totalIn, 0);
  const TI2 = rows.reduce((s, r) => s + r.b2.totalIn, 0);
  const TO1 = rows.reduce((s, r) => s + r.b1.totalOut, 0);
  const TO2 = rows.reduce((s, r) => s + r.b2.totalOut, 0);
  const TN1 = TI1 - TO1, TN2 = TI2 - TO2;
  const TNP1 = TI1 > 0 ? TN1/TI1 : 0, TNP2 = TI2 > 0 ? TN2/TI2 : 0;
  const TTX = rows.reduce((s, r) => s + r.b1.txCount + r.b2.txCount, 0);
  const TotA1 = new Array(12).fill(0).map((_, i) => rows.reduce((s, r) => s + r.arr1[i], 0));
  const TotA2 = new Array(12).fill(0).map((_, i) => rows.reduce((s, r) => s + r.arr2[i], 0));

  html += `<tr class="total-row"><td>TOTAL</td>`;
  if (single) {
    html += `<td class="pos">${fmt(TI2)}</td><td class="neg">${fmt(TO2)}</td><td class="${TN2>=0?'pos':'neg'}">${fmt(TN2)}</td><td>${pct(TNP2)}</td>${showTxCount ? `<td>${rows.reduce((s,r)=>s+r.b2.txCount,0)}</td>` : ''}${monthDataCells(TotA1, TotA2, cls)}`;
  } else {
    html += `<td class="pos">${fmt(TI1)}</td><td class="pos">${fmt(TI2)}</td>${deltaCell(TI2,TI1)}
             <td class="neg">${fmt(TO1)}</td><td class="neg">${fmt(TO2)}</td>${deltaCell(TO2,TO1)}
             <td class="${TN1>=0?'pos':'neg'}">${fmt(TN1)}</td><td class="${TN2>=0?'pos':'neg'}">${fmt(TN2)}</td>${deltaCell(TN2,TN1)}
             <td>${pct(TNP1)}</td><td>${pct(TNP2)}</td>
             ${showTxCount ? `<td>${TTX}</td>` : ''}
             ${monthDataCells(TotA1, TotA2, cls)}`;
  }
  html += `</tr></tbody></table></div>`;
  container.innerHTML = html;
  // Trigger search count
  filterTableByText(container.querySelector('table').id, '');
}

function updateDistPerfTable() {
  const view = document.getElementById('distPerfView').value;
  const container = document.getElementById('distPerfTableWrap');
  const y1 = compareFYs.year1, y2 = compareFYs.year2;
  const rows = buildPerfRows(computed.distPerf, view, y1, y2, false);
  renderPerfTable(container, 'Distributor', rows, view, y1, y2, true);
}
